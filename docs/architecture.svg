<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="Consolas, monospace">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f97316"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">Atlas Server — Architecture Overview</text>
  <text x="550" y="62" text-anchor="middle" fill="#94a3b8" font-size="12">schroeder-group.net | Hetzner VPS | Ubuntu 24.04 LTS</text>

  <!-- Internet Layer -->
  <rect x="30" y="85" width="1040" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="550" y="105" text-anchor="middle" fill="#94a3b8" font-size="11">INTERNET</text>
  <text x="200" y="130" text-anchor="middle" fill="#f8fafc" font-size="13">👤 Users / Browser</text>
  <text x="550" y="130" text-anchor="middle" fill="#64748b" font-size="13">── HTTPS (443) ──▶</text>
  <text x="900" y="130" text-anchor="middle" fill="#f97316" font-size="13">☁ Cloudflare Proxy</text>

  <!-- Arrow Cloudflare to NPM -->
  <line x1="550" y1="145" x2="550" y2="185" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="570" y="170" fill="#f97316" font-size="10">SSL Termination</text>

  <!-- UFW Firewall Bar -->
  <rect x="30" y="190" width="1040" height="30" rx="4" fill="#991b1b" opacity="0.8"/>
  <text x="550" y="210" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="bold">🔒 UFW FIREWALL — Ports: 22222/tcp (SSH) | 80/tcp (HTTP) | 443/tcp (HTTPS)</text>

  <!-- Docker Host -->
  <rect x="30" y="235" width="1040" height="555" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="55" y="260" fill="#38bdf8" font-size="13" font-weight="bold">🐳 DOCKER HOST</text>
  <text x="1045" y="260" text-anchor="end" fill="#475569" font-size="10">restart: unless-stopped</text>

  <!-- Proxy Network -->
  <rect x="50" y="275" width="1000" height="495" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="75" y="295" fill="#22c55e" font-size="11">🌐 network: proxy</text>

  <!-- NPM Box -->
  <rect x="380" y="310" width="340" height="70" rx="6" fill="#1a2744" stroke="#f97316" stroke-width="2"/>
  <text x="550" y="335" text-anchor="middle" fill="#f97316" font-size="14" font-weight="bold">Nginx Proxy Manager</text>
  <text x="550" y="355" text-anchor="middle" fill="#94a3b8" font-size="11">0.0.0.0:80 | 0.0.0.0:443 | 127.0.0.1:81</text>
  <text x="550" y="370" text-anchor="middle" fill="#64748b" font-size="10">Wildcard SSL: *.schroeder-group.net</text>

  <!-- Arrows from NPM to services -->
  <!-- Left column arrows -->
  <line x1="420" y1="380" x2="180" y2="430" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="470" y1="380" x2="390" y2="430" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="550" y1="380" x2="600" y2="430" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="630" y1="380" x2="810" y2="430" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Service Row 1 -->
  <!-- Heimdall -->
  <rect x="80" y="435" width="200" height="65" rx="5" fill="#1a2744" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="180" y="458" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="bold">Heimdall</text>
  <text x="180" y="475" text-anchor="middle" fill="#94a3b8" font-size="10">home.schroeder-group.net</text>
  <text x="180" y="490" text-anchor="middle" fill="#64748b" font-size="9">127.0.0.1:8084 → :80</text>

  <!-- Uptime Kuma -->
  <rect x="300" y="435" width="200" height="65" rx="5" fill="#1a2744" stroke="#22c55e" stroke-width="1.5"/>
  <text x="400" y="458" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="bold">Uptime Kuma</text>
  <text x="400" y="475" text-anchor="middle" fill="#94a3b8" font-size="10">status.schroeder-group.net</text>
  <text x="400" y="490" text-anchor="middle" fill="#64748b" font-size="9">127.0.0.1:3001 → :3001</text>

  <!-- Stirling PDF -->
  <rect x="520" y="435" width="200" height="65" rx="5" fill="#1a2744" stroke="#ef4444" stroke-width="1.5"/>
  <text x="620" y="458" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="bold">Stirling PDF</text>
  <text x="620" y="475" text-anchor="middle" fill="#94a3b8" font-size="10">pdf.schroeder-group.net</text>
  <text x="620" y="490" text-anchor="middle" fill="#64748b" font-size="9">127.0.0.1:8085 → :8080</text>

  <!-- Whoogle -->
  <rect x="740" y="435" width="200" height="65" rx="5" fill="#1a2744" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="840" y="458" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold">Whoogle</text>
  <text x="840" y="475" text-anchor="middle" fill="#94a3b8" font-size="10">search.schroeder-group.net</text>
  <text x="840" y="490" text-anchor="middle" fill="#64748b" font-size="9">127.0.0.1:5000 → :5000</text>

  <!-- Arrows from NPM to Row 2 -->
  <line x1="450" y1="380" x2="180" y2="530" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="500" y1="380" x2="400" y2="540" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="600" y1="380" x2="660" y2="540" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Vaultwarden -->
  <rect x="80" y="520" width="200" height="65" rx="5" fill="#1a2744" stroke="#eab308" stroke-width="1.5"/>
  <text x="180" y="543" text-anchor="middle" fill="#eab308" font-size="12" font-weight="bold">🔐 Vaultwarden</text>
  <text x="180" y="560" text-anchor="middle" fill="#94a3b8" font-size="10">vault.schroeder-group.net</text>
  <text x="180" y="575" text-anchor="middle" fill="#64748b" font-size="9">127.0.0.1:8222 → :80</text>

  <!-- Nextcloud Group -->
  <rect x="300" y="520" width="310" height="140" rx="5" fill="#0c1425" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="320" y="542" fill="#38bdf8" font-size="10">network: nextcloud-internal</text>

  <rect x="315" y="550" width="175" height="50" rx="4" fill="#1a2744" stroke="#38bdf8" stroke-width="1"/>
  <text x="402" y="570" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">Nextcloud</text>
  <text x="402" y="585" text-anchor="middle" fill="#94a3b8" font-size="9">cloud.schroeder-group.net</text>

  <rect x="315" y="610" width="175" height="40" rx="4" fill="#1a2744" stroke="#475569" stroke-width="1"/>
  <text x="402" y="635" text-anchor="middle" fill="#94a3b8" font-size="11">MariaDB 10.11</text>

  <line x1="402" y1="600" x2="402" y2="610" stroke="#475569" stroke-width="1.5"/>
  <text x="510" y="575" fill="#64748b" font-size="9">127.0.0.1:</text>
  <text x="510" y="588" fill="#64748b" font-size="9">8080 → :80</text>

  <!-- Paperless Group -->
  <rect x="630" y="520" width="310" height="140" rx="5" fill="#0c1425" stroke="#10b981" stroke-width="1.5"/>
  <text x="650" y="542" fill="#10b981" font-size="10">network: paperless-internal</text>

  <rect x="645" y="550" width="175" height="50" rx="4" fill="#1a2744" stroke="#10b981" stroke-width="1"/>
  <text x="732" y="570" text-anchor="middle" fill="#10b981" font-size="12" font-weight="bold">Paperless-ngx</text>
  <text x="732" y="585" text-anchor="middle" fill="#94a3b8" font-size="9">docs.schroeder-group.net</text>

  <rect x="645" y="610" width="110" height="40" rx="4" fill="#1a2744" stroke="#475569" stroke-width="1"/>
  <text x="700" y="635" text-anchor="middle" fill="#94a3b8" font-size="10">Postgres 15</text>

  <rect x="770" y="610" width="80" height="40" rx="4" fill="#1a2744" stroke="#475569" stroke-width="1"/>
  <text x="810" y="635" text-anchor="middle" fill="#94a3b8" font-size="10">Redis 7</text>

  <line x1="700" y1="600" x2="700" y2="610" stroke="#475569" stroke-width="1.5"/>
  <line x1="810" y1="600" x2="810" y2="610" stroke="#475569" stroke-width="1.5"/>
  <text x="840" y="575" fill="#64748b" font-size="9">127.0.0.1:</text>
  <text x="840" y="588" fill="#64748b" font-size="9">8000 → :8000</text>

  <!-- Security Layer Info -->
  <rect x="50" y="690" width="1000" height="75" rx="5" fill="#14231f" stroke="#22c55e" stroke-width="1"/>
  <text x="75" y="712" fill="#22c55e" font-size="12" font-weight="bold">🛡 Security Layers</text>
  <text x="75" y="732" fill="#94a3b8" font-size="10">SSH: Key-only | Custom Port | AllowUsers admin | MaxAuthTries 3</text>
  <text x="75" y="747" fill="#94a3b8" font-size="10">Fail2Ban: SSH jail active | sysctl: SYN cookies, anti-spoofing, no redirects, no source routing | Shared Memory: noexec,nosuid</text>

  <!-- Legend -->
  <rect x="680" y="695" width="355" height="60" rx="4" fill="#1e293b"/>
  <text x="700" y="715" fill="#94a3b8" font-size="10">Legend:</text>
  <line x1="700" y1="730" x2="730" y2="730" stroke="#f97316" stroke-width="2"/>
  <text x="735" y="734" fill="#94a3b8" font-size="9">Public-facing (80/443)</text>
  <line x1="830" y1="730" x2="860" y2="730" stroke="#22c55e" stroke-width="2"/>
  <text x="865" y="734" fill="#94a3b8" font-size="9">proxy network</text>
  <line x1="960" y1="730" x2="990" y2="730" stroke="#475569" stroke-width="2"/>
  <text x="995" y="734" fill="#94a3b8" font-size="9">DB internal</text>
  <line x1="700" y1="747" x2="730" y2="747" stroke="#991b1b" stroke-width="2"/>
  <text x="735" y="750" fill="#94a3b8" font-size="9">127.0.0.1 bound (not public)</text>

  <!-- Footer -->
  <text x="550" y="808" text-anchor="middle" fill="#475569" font-size="10">github.com/MircoSchroeder/atlas-selfhosted-server</text>
</svg>
