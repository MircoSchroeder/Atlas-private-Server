services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "https://vault.example.com"
      SIGNUPS_ALLOWED: "false"
    ports:
      - "127.0.0.1:8222:80"
    volumes:
      - ./data:/data
    networks:
      - proxy

networks:
  proxy:
    external: true
